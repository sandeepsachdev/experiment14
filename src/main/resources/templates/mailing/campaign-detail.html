<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Campaign Detail')}"></head>
<body th:replace="~{fragments/layout :: page('Campaign Detail', ~{::main})}">
<main>
  <div class="mb-3">
    <a th:href="@{/mailing/campaigns}" class="text-decoration-none text-muted">
      <i class="bi bi-arrow-left me-1"></i> Back to Campaigns
    </a>
  </div>

  <div class="d-flex justify-content-between align-items-start mb-4">
    <div>
      <h4 class="mb-1" th:text="${campaign.name}"></h4>
      <p class="text-muted mb-1">Subject: <strong th:text="${campaign.subject}"></strong></p>
      <p class="mb-0">
        <span th:switch="${campaign.status.name()}">
          <span th:case="'DRAFT'" class="badge bg-secondary">Draft</span>
          <span th:case="'SENDING'" class="badge bg-warning text-dark">Sending</span>
          <span th:case="'SENT'" class="badge bg-success">Sent</span>
          <span th:case="'FAILED'" class="badge bg-danger">Failed</span>
        </span>
        <span th:if="${campaign.sentAt != null}" class="text-muted ms-2 small">
          Sent <span th:text="${#temporals.format(campaign.sentAt, 'dd MMM yyyy HH:mm')}"></span>
        </span>
      </p>
    </div>
    <div class="d-flex gap-2">
      <a th:href="@{/mailing/campaigns/{id}/edit(id=${campaign.id})}"
         th:if="${campaign.status.name() == 'DRAFT'}"
         class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-pencil me-1"></i> Edit
      </a>
      <form th:action="@{/mailing/campaigns/{id}/delete(id=${campaign.id})}" method="post"
            onsubmit="return confirm('Delete this campaign?')">
        <button type="submit" class="btn btn-sm btn-outline-danger">
          <i class="bi bi-trash me-1"></i> Delete
        </button>
      </form>
    </div>
  </div>

  <!-- Stats cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card border-0 shadow-sm text-center">
        <div class="card-body">
          <div class="fs-2 fw-bold text-primary" th:text="${campaign.totalSent}">0</div>
          <div class="text-muted">Sent</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card border-0 shadow-sm text-center">
        <div class="card-body">
          <div class="fs-2 fw-bold text-danger" th:text="${campaign.totalBounced}">0</div>
          <div class="text-muted">Bounced</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card border-0 shadow-sm text-center">
        <div class="card-body">
          <div class="fs-2 fw-bold text-success" th:text="${campaign.totalReplied}">0</div>
          <div class="text-muted">Replied</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card border-0 shadow-sm text-center">
        <div class="card-body">
          <div class="fs-2 fw-bold text-info"
               th:text="${campaign.totalSent - campaign.totalBounced}">0</div>
          <div class="text-muted">Delivered</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Recipients link -->
  <div class="mb-4" th:if="${campaign.totalSent > 0}">
    <a th:href="@{/mailing/campaigns/{id}/recipients(id=${campaign.id})}"
       class="btn btn-outline-primary">
      <i class="bi bi-list-ul me-1"></i> View All Recipients
    </a>
  </div>

  <!-- Send form (only for draft) -->
  <div th:if="${campaign.status.name() == 'DRAFT'}" class="card border-0 shadow-sm mb-4" style="max-width: 540px;">
    <div class="card-header bg-white fw-semibold">
      <i class="bi bi-send me-2"></i>Send Campaign
    </div>
    <div class="card-body">
      <div th:if="${mailingLists.isEmpty()}" class="alert alert-warning">
        No mailing lists yet. <a th:href="@{/mailing/lists/new}">Create one first.</a>
      </div>
      <form th:if="${!mailingLists.isEmpty()}"
            th:action="@{/mailing/campaigns/{id}/send(id=${campaign.id})}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Select Mailing Lists</label>
          <div th:each="list : ${mailingLists}" class="form-check">
            <input type="checkbox" class="form-check-input" name="mailingListIds"
                   th:value="${list.id}" th:id="'list-' + ${list.id}">
            <label class="form-check-label" th:for="'list-' + ${list.id}">
              <span th:text="${list.name}"></span>
              <span class="text-muted small" th:text="'(' + ${list.contacts.size()} + ' contacts)'"></span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-success"
                onclick="return confirm('Send this campaign now?')">
          <i class="bi bi-send me-1"></i> Send Now
        </button>
      </form>
    </div>
  </div>

  <!-- Email preview -->
  <div class="card border-0 shadow-sm" style="max-width: 760px;">
    <div class="card-header bg-white fw-semibold">Email Preview</div>
    <div class="card-body">
      <div th:if="${campaign.bodyHtml != null and !campaign.bodyHtml.isBlank()}"
           th:utext="${campaign.bodyHtml}"
           class="border rounded p-3 bg-light"></div>
      <pre th:if="${campaign.bodyHtml == null or campaign.bodyHtml.isBlank()}"
           th:text="${campaign.bodyText}" class="mb-0"></pre>
    </div>
  </div>
</main>
</body>
</html>

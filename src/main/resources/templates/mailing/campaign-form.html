<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Campaign')}"></head>
<body th:replace="~{fragments/layout :: page('Campaign', ~{::main})}">
<main>
  <div class="mb-3">
    <a th:href="@{/mailing/campaigns}" class="text-decoration-none text-muted">
      <i class="bi bi-arrow-left me-1"></i> Back to Campaigns
    </a>
  </div>

  <h4 class="mb-4" th:text="${campaign != null} ? 'Edit Campaign' : 'New Campaign'"></h4>

  <div class="card border-0 shadow-sm" style="max-width: 760px;">
    <div class="card-body">
      <form th:action="${campaign != null} ? @{/mailing/campaigns/{id}(id=${campaign.id})} : @{/mailing/campaigns}"
            method="post">
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Campaign Name <span class="text-danger">*</span></label>
          <input type="text" id="name" name="name" class="form-control" required
                 th:value="${campaign?.name}" placeholder="e.g. May Newsletter">
        </div>
        <div class="mb-3">
          <label for="subject" class="form-label fw-semibold">Email Subject <span class="text-danger">*</span></label>
          <input type="text" id="subject" name="subject" class="form-control" required
                 th:value="${campaign?.subject}" placeholder="e.g. Our May Update">
        </div>
        <div class="mb-3">
          <label for="bodyText" class="form-label fw-semibold">Plain Text Body</label>
          <textarea id="bodyText" name="bodyText" class="form-control font-monospace" rows="5"
                    placeholder="Plain text version of your email..."
                    th:text="${campaign?.bodyText}"></textarea>
        </div>
        <div class="mb-4">
          <label for="bodyHtml" class="form-label fw-semibold">HTML Body</label>
          <textarea id="bodyHtml" name="bodyHtml" class="form-control font-monospace" rows="10"
                    placeholder="&lt;p&gt;Your HTML email content here...&lt;/p&gt;"
                    th:text="${campaign?.bodyHtml}"></textarea>
          <div class="form-text">If blank, plain text will be used for both.</div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <span th:text="${campaign != null} ? 'Save Changes' : 'Create Campaign'"></span>
          </button>
          <a th:href="@{/mailing/campaigns}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New Mailing List')}"></head>
<body th:replace="~{fragments/layout :: page('New Mailing List', ~{::main})}">
<main>
  <div class="mb-4">
    <a th:href="@{/mailing/lists}" class="text-decoration-none text-muted">
      <i class="bi bi-arrow-left me-1"></i> Back to Lists
    </a>
  </div>
  <h4 class="mb-4">New Mailing List</h4>

  <div class="card border-0 shadow-sm" style="max-width: 540px;">
    <div class="card-body">
      <form th:action="@{/mailing/lists}" method="post">
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
          <input type="text" id="name" name="name" class="form-control" required placeholder="e.g. Newsletter Subscribers">
        </div>
        <div class="mb-4">
          <label for="description" class="form-label fw-semibold">Description</label>
          <input type="text" id="description" name="description" class="form-control" placeholder="Optional description">
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Create List</button>
          <a th:href="@{/mailing/lists}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — Gmail Client'">Gmail Client</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { font-size: 0.9rem; }
        .sidebar { min-height: calc(100vh - 56px); background: #f8f9fa; border-right: 1px solid #dee2e6; }
        .sidebar .nav-link { color: #333; padding: 0.4rem 1rem; border-radius: 20px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #e8f0fe; color: #1a73e8; font-weight: 500; }
        .email-row:hover { background: #f0f4ff; cursor: pointer; }
        .email-subject { font-weight: 600; }
        .email-snippet { color: #666; font-weight: 400; }
        .compose-btn { border-radius: 20px; }
        .navbar-brand { font-weight: 700; color: #1a73e8 !important; }
        .flash-alert { position: fixed; top: 70px; right: 20px; z-index: 9999; min-width: 300px; }
    </style>
</head>

<body th:fragment="page(title, content)">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/inbox}">
                <i class="bi bi-envelope-fill text-danger"></i> Gmail Client
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-muted" sec:authentication="name">User</span>
                <form th:action="@{/logout}" method="post" class="mb-0">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-box-arrow-right"></i> Sign out
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar py-3 px-2">
                <a th:href="@{/compose}" class="btn btn-light border compose-btn w-100 mb-3 text-start">
                    <i class="bi bi-pencil-square me-2"></i> Compose
                </a>
                <nav class="nav flex-column">
                    <!-- System labels -->
                    <a class="nav-link"
                       th:classappend="${currentLabel == 'INBOX'} ? 'active'"
                       th:href="@{/inbox(label='INBOX')}">
                        <i class="bi bi-inbox me-2"></i> Inbox
                    </a>
                    <a class="nav-link"
                       th:classappend="${currentLabel == 'SENT'} ? 'active'"
                       th:href="@{/inbox(label='SENT')}">
                        <i class="bi bi-send me-2"></i> Sent
                    </a>
                    <a class="nav-link"
                       th:classappend="${currentLabel == 'DRAFT'} ? 'active'"
                       th:href="@{/inbox(label='DRAFT')}">
                        <i class="bi bi-file-earmark me-2"></i> Drafts
                    </a>
                    <a class="nav-link"
                       th:classappend="${currentLabel == 'SPAM'} ? 'active'"
                       th:href="@{/inbox(label='SPAM')}">
                        <i class="bi bi-exclamation-octagon me-2"></i> Spam
                    </a>
                    <a class="nav-link"
                       th:classappend="${currentLabel == 'TRASH'} ? 'active'"
                       th:href="@{/inbox(label='TRASH')}">
                        <i class="bi bi-trash me-2"></i> Trash
                    </a>

                    <!-- User labels -->
                    <th:block th:if="${labels != null and !labels.isEmpty()}">
                        <hr class="my-2"/>
                        <small class="text-muted px-3 mb-1 d-block">Labels</small>
                        <th:block th:each="lbl : ${labels}" th:if="${lbl.type == 'user'}">
                            <a class="nav-link"
                               th:classappend="${currentLabel == lbl.id} ? 'active'"
                               th:href="@{/inbox(label=${lbl.id})}"
                               th:text="${lbl.name}">Label</a>
                        </th:block>
                    </th:block>
                </nav>
            </div>

            <!-- Main content -->
            <div class="col-md-10 py-3">
                <!-- Flash messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show flash-alert" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show flash-alert" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:replace="${content}">Content goes here</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmZfMJCxwBGe7//JFKJEpSa4O4D+"
            crossorigin="anonymous"></script>
</body>
</html>

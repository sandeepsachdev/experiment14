<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Inbox')}"></head>
<body th:replace="~{fragments/layout :: page('Inbox', ~{::main})}">
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 fw-semibold" th:text="${currentLabel}">Inbox</h5>
        <small class="text-muted" th:text="${messages.size()} + ' messages'">0 messages</small>
    </div>

    <div th:if="${messages.isEmpty()}" class="text-center text-muted py-5">
        <i class="bi bi-inbox display-4 d-block mb-3"></i>
        <p>No messages in this folder.</p>
    </div>

    <div th:if="${!messages.isEmpty()}" class="card border-0 shadow-sm">
        <table class="table table-hover mb-0">
            <tbody>
            <tr th:each="msg : ${messages}"
                class="email-row"
                th:onclick="|window.location.href='@{/email/{id}(id=${msg.id})}'|"
                style="cursor:pointer">
                <td class="ps-3 py-2" style="width:220px">
                    <span class="fw-semibold text-truncate d-block" style="max-width:200px"
                          th:text="${msg.from}">sender@example.com</span>
                </td>
                <td class="py-2">
                    <span class="email-subject" th:text="${msg.subject ?: '(no subject)'}">Subject</span>
                    <span class="email-snippet ms-2 text-muted" th:text="${' — ' + msg.snippet}">snippet</span>
                </td>
                <td class="pe-3 py-2 text-end text-muted text-nowrap" style="width:160px"
                    th:text="${msg.date}">Jan 1, 2024</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>

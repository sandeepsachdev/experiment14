spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID_HERE}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET_HERE}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/gmail.readonly
              - https://www.googleapis.com/auth/gmail.send
              - https://www.googleapis.com/auth/gmail.modify

  # Jakarta Mail session — only used for MimeMessage construction by GmailService, not SMTP
  mail:
    host: localhost
    port: 25

  datasource:
    url: jdbc:h2:mem:mailingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    com.example.gmailclient: DEBUG
    org.springframework.security: INFO

# ---- Mailing System (SMTP + IMAP via Gmail App Password) ----
mailing:
  smtp:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:your-email@gmail.com}
    password: ${GMAIL_APP_PASSWORD:your-app-password}
    from: ${GMAIL_FROM:${GMAIL_USERNAME:your-email@gmail.com}}
  imap:
    host: imap.gmail.com
    port: 993
    username: ${GMAIL_USERNAME:your-email@gmail.com}
    password: ${GMAIL_APP_PASSWORD:your-app-password}
    folder: INBOX
  poll:
    interval-ms: 60000
  message-id-domain: mailing.local

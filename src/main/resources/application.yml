spring:
  security:
    oauth2:
      client:
        registration:
          google:
            # Set these via environment variables or replace the placeholders below
            # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET from Google Cloud Console
            # Required redirect URI to register in Google Cloud Console:
            #   http://localhost:8080/login/oauth2/code/google
            client-id: ${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID_HERE}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET_HERE}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/gmail.readonly
              - https://www.googleapis.com/auth/gmail.send
              - https://www.googleapis.com/auth/gmail.modify

  # Jakarta Mail session — only used for MimeMessage construction, not SMTP
  mail:
    host: localhost
    port: 25

server:
  port: 8080

logging:
  level:
    com.example.gmailclient: DEBUG
    org.springframework.security: INFO
